site_name: "Cool stuff happens here"
site_author: "Emma Tosch (e.tosch@northeastern.edu)"
site_description: "Project navigation and blog for work on games, PL, logic, experimentation, multi-agent reasoning, causality, and related topics that we in the POEM Lab are passionate about!"
docs_dir: "src"
use_directory_urls: false
site_url: "https://explcause.github.io"
repo_url: "https://github.com/ExPLCause/explcause.github.io"
repo_name: "Github"

theme: 
  name: material
  features: 
    - naviation.sections
  custom_dir: overrides

markdown_extensions:
  - attr_list
  - extra
  - sane_lists
  - tables
  - nl2br  

plugins: 
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date 
      categories:
      - categories
      - tags
      # categories_allowed:
      # - Generic
      # - Admin
      # - Intervention
      # - PL
      # - Causality
      # - Experimentation
      # - Science
      comments_path: "$__comments"
  - blog:
      blog_dir: .
  - diagrams
  - search 
  - tags

nav: 
- about.md 
- index.md
- projects.md
- get_involved.md

markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
